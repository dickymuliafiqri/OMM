services:
  omm-bench:
    build: .
    ports:
      - "9090:9090"
    environment:
      - OMM_LISTEN_ADDR=:9090
      - OMM_BENCH_SECRET=${OMM_BENCH_SECRET}
      - OMM_ALLOWED_ORIGINS=${OMM_ALLOWED_ORIGINS}
      - OMM_MAX_CONCURRENT_JOBS=${OMM_MAX_CONCURRENT_JOBS:-3}
      - OMM_JOB_TIMEOUT_SEC=${OMM_JOB_TIMEOUT_SEC:-300}
      - OMM_GLOBAL_RATE_LIMIT=${OMM_GLOBAL_RATE_LIMIT:-30}
      - OMM_PER_SOURCE_RATE_LIMIT=${OMM_PER_SOURCE_RATE_LIMIT:-5}
      - OMM_LOG_LEVEL=${OMM_LOG_LEVEL:-info}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
