services:
  benchmark-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omm-benchmark-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HEALTH_CHECK_PORT:-8080}:8080"
    environment:
      - HEALTH_CHECK_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
